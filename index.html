<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Setlist</title>
<style>
  :root{
    --bg:#0d0f0d;
    --panel:#171a17;
    --panel-hi:#20241f;
    --set-panel:#1b1f2a;
    --set-panel-hi:#242a3a;
    --line:#2a2f29;
    --set-line:#333c52;
    --text:#f2f1ea;
    --sub:#9aa39a;
    --amber:#e0a640;
    --amber-dim:#7a5c26;
    --chip-bg:#171a17;
    --chip-line:#2a2f29;
    --modal-bg:#14161e;
    --modal-panel:#1b1f2a;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;
    overscroll-behavior:none;
  }

  header{
    padding:18px 16px 10px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }

  header h1{
    margin:0;
    font-size:1.15rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--amber);
  }

  header p{
    margin:4px 0 0;
    font-size:.75rem;
    color:var(--sub);
  }

  main{
    padding:12px;
    max-width:1100px;
    margin:0 auto;
  }

  /* ---------- Set section ---------- */
  .set-section{
    margin-bottom:16px;
  }

  .set-section h2{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin:0 0 8px;
    font-size:.85rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text);
  }

  .set-section h2 .hint{
    font-size:.68rem;
    color:var(--sub);
    text-transform:none;
    letter-spacing:0;
    font-weight:400;
  }

  .set-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    min-height:74px;
    padding:10px;
    border:2px dashed var(--set-line);
    border-radius:12px;
    background:rgba(36,42,58,.25);
    transition:background .15s ease, border-color .15s ease;
  }

  .set-grid.drop-active{
    background:rgba(224,166,64,.10);
    border-color:var(--amber-dim);
  }

  .set-grid .placeholder{
    margin:auto;
    color:var(--sub);
    font-size:.8rem;
    padding:12px;
    text-align:center;
    pointer-events:none;
  }

  .set-grid.empty .placeholder{ display:block; }
  .set-grid:not(.empty) .placeholder{ display:none; }

  .set-grid .card{
    flex:0 0 auto;
    width:calc(33.333% - 7px);
    background:var(--set-panel);
    border-color:var(--set-line);
  }

  @media (orientation:landscape){
    .set-grid .card{ width:calc(25% - 8px); }
  }
  @media (min-width:640px) and (min-aspect-ratio:1/1){
    .set-grid .card{ width:calc(25% - 8px); }
  }

  /* ---------- Search ---------- */
  .search-wrap{
    position:relative;
    margin:14px 0 10px;
  }

  .search-wrap input{
    width:100%;
    padding:11px 38px 11px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-size:.9rem;
    outline:none;
    transition:border-color .12s ease, background .12s ease;
  }

  .search-wrap input::placeholder{ color:var(--sub); }

  .search-wrap input:focus{
    border-color:var(--amber-dim);
    background:var(--panel-hi);
  }

  .search-wrap .search-icon{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--sub);
    pointer-events:none;
    font-size:.85rem;
  }

  .search-wrap .clear-btn{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--sub);
    font-size:1.1rem;
    line-height:1;
    padding:6px;
    cursor:pointer;
    display:none;
  }

  .search-wrap.has-text .search-icon{ display:none; }
  .search-wrap.has-text .clear-btn{ display:block; }

  /* ---------- Filters ---------- */
  .filters{
    margin-bottom:14px;
  }

  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:6px;
  }

  .filter-row .row-label{
    font-size:.62rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--sub);
    width:100%;
    margin:6px 0 2px;
  }

  .chip{
    padding:6px 12px;
    background:var(--chip-bg);
    border:1px solid var(--chip-line);
    border-radius:999px;
    color:var(--sub);
    font-size:.72rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
  }

  .chip.active{
    background:rgba(224,166,64,.14);
    border-color:var(--amber);
    color:var(--amber);
  }

  @media (hover:hover){
    .chip:hover{ border-color:var(--amber-dim); color:var(--text); }
    .chip.active:hover{ color:var(--amber); }
  }

  .results-hint{
    font-size:.7rem;
    color:var(--sub);
    margin:2px 0 12px;
  }

  .results-hint .clear-filters{
    color:var(--amber);
    cursor:pointer;
    text-decoration:underline;
    margin-left:6px;
  }

  .no-results{
    text-align:center;
    color:var(--sub);
    font-size:.85rem;
    padding:40px 12px;
  }

  /* ---------- Main grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }

  @media (orientation:landscape){
    .grid{ grid-template-columns:repeat(4, 1fr); }
  }
  @media (min-width:640px) and (min-aspect-ratio:1/1){
    .grid{ grid-template-columns:repeat(4, 1fr); }
  }

  .grid.drop-active{
    outline:2px dashed var(--amber-dim);
    outline-offset:6px;
    border-radius:12px;
  }

  /* ---------- Card ---------- */
  .card{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:6px;
    min-height:88px;
    padding:12px 8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    touch-action:none;
    cursor:grab;
    position:relative;
    transition:background .12s ease, border-color .12s ease, opacity .12s ease;
  }

  .card:active{ cursor:grabbing; }

  .card.dragging-source{
    opacity:.3;
  }

  .card:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  @media (hover:hover){
    .card:hover{
      background:var(--panel-hi);
      border-color:var(--amber-dim);
    }
    .set-grid .card:hover{
      background:var(--set-panel-hi);
    }
  }

  .title{
    font-size:.93rem;
    font-weight:700;
    line-height:1.2;
  }

  .artist{
    font-size:.7rem;
    font-weight:400;
    color:var(--sub);
    line-height:1.2;
  }

  .key-badge{
    position:absolute;
    top:6px;
    right:7px;
    font-size:.6rem;
    font-weight:700;
    color:var(--amber-dim);
    letter-spacing:.03em;
  }

  .drag-clone{
    position:fixed;
    z-index:999;
    pointer-events:none;
    opacity:.92;
    transform:scale(1.04) rotate(-1deg);
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    border-radius:10px;
  }

  footer{
    text-align:center;
    padding:20px 12px 30px;
    color:var(--sub);
    font-size:.68rem;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,6,5,.72);
    backdrop-filter:blur(3px);
    z-index:1000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }

  @media (min-width:640px){
    .modal-overlay{ align-items:center; }
  }

  .modal-overlay.open{
    opacity:1;
    pointer-events:auto;
  }

  .modal{
    width:100%;
    max-width:640px;
    max-height:94vh;
    background:var(--modal-panel);
    border:1px solid var(--set-line);
    border-radius:18px 18px 0 0;
    display:flex;
    flex-direction:column;
    transform:translateY(24px);
    transition:transform .2s ease;
    overflow:hidden;
  }

  @media (min-width:640px){
    .modal{
      max-height:88vh;
      border-radius:18px;
      transform:translateY(0) scale(.97);
    }
  }

  .modal-overlay.open .modal{
    transform:translateY(0) scale(1);
  }

  .modal-head{
    padding:20px 20px 14px;
    border-bottom:1px solid var(--set-line);
    position:relative;
    flex:0 0 auto;
  }

  .modal-close{
    position:absolute;
    top:14px;
    right:14px;
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid var(--set-line);
    color:var(--text);
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .modal-title{
    font-size:1.35rem;
    font-weight:800;
    line-height:1.15;
    margin:0 40px 4px 0;
  }

  .modal-artist{
    font-size:.85rem;
    color:var(--sub);
    margin:0;
  }

  .modal-tags{
    display:flex;
    gap:6px;
    margin-top:10px;
    flex-wrap:wrap;
  }

  .modal-tags span{
    font-size:.65rem;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--sub);
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:999px;
  }

  .modal-body{
    padding:18px 20px 10px;
    overflow-y:auto;
    flex:1 1 auto;
  }

  .modal-key{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:22px;
  }

  .modal-key .label{
    font-size:.65rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--sub);
  }

  .modal-key .value{
    font-size:1.6rem;
    font-weight:800;
    color:var(--amber);
  }

  .modal-section-label{
    font-size:.65rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--sub);
    margin:0 0 8px;
  }

  .form-chain{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:24px;
  }

  .form-chain .step{
    font-size:.78rem;
    font-weight:600;
    padding:6px 11px;
    background:rgba(224,166,64,.08);
    border:1px solid var(--amber-dim);
    border-radius:999px;
    color:var(--text);
  }

  .form-chain .arrow{
    color:var(--sub);
    font-size:.78rem;
    align-self:center;
  }

  .chord-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:6px;
  }

  .chord-row{
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
  }

  .chord-row .sec-name{
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--amber-dim);
    margin-bottom:5px;
  }

  .chord-row .prog{
    font-family:"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
    font-size:1.05rem;
    font-weight:600;
    color:var(--text);
    letter-spacing:.01em;
    line-height:1.4;
  }

  .modal-foot{
    padding:14px 20px 20px;
    border-top:1px solid var(--set-line);
    display:flex;
    gap:10px;
    flex:0 0 auto;
  }

  .modal-foot a, .modal-foot button{
    flex:1;
    text-align:center;
    padding:12px;
    border-radius:10px;
    font-size:.82rem;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    border:1px solid var(--set-line);
    background:rgba(255,255,255,.04);
    color:var(--text);
  }

  .modal-foot .primary{
    background:var(--amber);
    border-color:var(--amber);
    color:#1b1400;
  }
</style>
</head>
<body>

<header>
  <h1>Setlist</h1>
  <p id="songCount">491 songs &middot; tap to view &middot; drag to build a set</p>
</header>

<main>
  <section class="set-section">
    <h2>Set <span id="setCount"></span> <span class="hint">drag songs up here</span></h2>
    <div class="set-grid empty" id="setGrid">
      <p class="placeholder">Drag songs up here to build your set</p>
    </div>
  </section>

  <div class="search-wrap" id="searchWrap">
    <input type="text" id="searchInput" placeholder="Search songs or artists&hellip;" autocomplete="off" spellcheck="false">
    <span class="search-icon">&#128269;</span>
    <button class="clear-btn" id="clearSearch" aria-label="Clear search">&times;</button>
  </div>

  <div class="filters">
    <div class="filter-row" id="genreRow"></div>
    <div class="filter-row" id="decadeRow"></div>
  </div>

  <p class="results-hint" id="resultsHint"></p>

  <section>
    <div class="grid" id="grid"></div>
    <p class="no-results" id="noResults" style="display:none;">No songs match your search / filters.</p>
  </section>
</main>

<footer>Tap a card for key &amp; chords &middot; drag to move it &middot; links open Ultimate Guitar</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalPanel" role="dialog" aria-modal="true">
    <div class="modal-head">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <p class="modal-title" id="modalTitle"></p>
      <p class="modal-artist" id="modalArtist"></p>
      <div class="modal-tags" id="modalTags"></div>
    </div>
    <div class="modal-body">
      <div class="modal-key">
        <span class="label">Key</span>
        <span class="value" id="modalKey"></span>
      </div>

      <p class="modal-section-label">Form</p>
      <div class="form-chain" id="modalForm"></div>

      <p class="modal-section-label">Chord Progressions</p>
      <div class="chord-list" id="modalChords"></div>
    </div>
    <div class="modal-foot">
      <button id="modalSetToggle"></button>
      <a id="modalTabLink" href="#" target="_blank" rel="noopener noreferrer" class="primary">View Tab &#8599;</a>
    </div>
  </div>
</div>

t", "key": "A Minor", "chordSections": [{"section": "Verse", "chords": "Am - F - C - G"}], "form": ["Intro", "Verse", "Chorus", "Verse", "Chorus", "Bridge", "Chorus", "Outro"], "url": "https://www.ultimate-guitar.com/search.php?search_type=title&value=You+Found+Me+The+Fray"}, {"id": "song-486", "title": "You Worry Me", "artist": "Nathaniel Rateliff & The Night Sweats", "year": 2015, "decade": "2010s", "genre": "Blues/Soul/Jazz", "key": "E Major", "chordSections": [{"section": "Verse", "chords": "E - A - B"}], "form": ["Intro", "Verse", "Chorus", "Verse", "Chorus", "Bridge", "Chorus", "Outro"], "url": "https://www.ultimate-guitar.com/search.php?search_type=title&value=You+Worry+Me+Nathaniel+Rateliff+%26+The+Night+Sweats"}, {"id": "song-487", "title": "Young Dumb And Broke", "artist": "Khalid", "year": 2017, "decade": "2010s", "genre": "Hip-Hop/R&B", "key": "G Major", "chordSections": [{"section": "Verse", "chords": "G - D - Em - C"}], "form": ["Verse", "Chorus", "Verse", "Chorus", "Bridge", "Chorus"], "url": "https://www.ultimate-guitar.com/search.php?search_type=title&value=Young+Dumb+And+Broke+Khalid"}, {"id": "song-488", "title": "Your Love", "artist": "The Outfield", "year": 1986, "decade": "1980s", "genre": "Classic Rock", "key": "A Major", "chordSections": [{"section": "Verse", "chords": "A - E - F#m - D"}], "form": ["Intro", "Verse", "Chorus", "Verse", "Chorus", "Bridge", "Chorus", "Outro"], "url": "https://www.ultimate-guitar.com/search.php?search_type=title&value=Your+Love+The+Outfield"}, {"id": "song-489", "title": "Your Love", "artist": "Daithi De Nogla", "year": 2020, "decade": "2020s", "genre": "Pop", "key": "C Major", "chordSections": [{"section": "Verse", "chords": "C - G - Am - F"}], "form": ["Verse", "Chorus", "Verse", "Chorus", "Bridge", "Chorus"], "url": "https://www.ultimate-guitar.com/search.php?search_type=title&value=Your+Love+Daithi+De+Nogla"}, {"id": "song-490", "title": "Youre A Wolf", "artist": "Sea Wolf", "year": 2007, "decade": "2000s", "genre": "Indie/Folk", "key": "A Minor", "chordSections": [{"section": "Verse", "chords": "Am - F - C - G"}], "form": ["Verse", "Chorus", "Verse", "Chorus", "Bridge", "Chorus"], "url": "https://www.ultimate-guitar.com/search.php?search_type=title&value=Youre+A+Wolf+Sea+Wolf"}];
</script>
<script>
// songData is defined inline in index.html as `const songData = [...]`

// stable ids + in-memory state (inSet flag). No persistence by design.
const songs = songData.map(s => ({ ...s, inSet: false }));

const GENRES = ["All", "Rock/Alt", "Pop", "Indie/Folk", "Classic Rock", "Blues/Soul/Jazz",
                "Country/Americana", "Punk/Metal", "Hip-Hop/R&B", "Electronic/Dance", "Reggae/Ska"];
const DECADES = ["All", "1950s", "1960s", "1970s", "1980s", "1990s", "2000s", "2010s", "2020s"];

const state = {
  search: "",
  genre: "All",
  decade: "All",
};

const gridEl = document.getElementById('grid');
const setGridEl = document.getElementById('setGrid');
const setCountEl = document.getElementById('setCount');
const songCountEl = document.getElementById('songCount');
const searchInput = document.getElementById('searchInput');
const searchWrap = document.getElementById('searchWrap');
const clearSearchBtn = document.getElementById('clearSearch');
const genreRow = document.getElementById('genreRow');
const decadeRow = document.getElementById('decadeRow');
const resultsHint = document.getElementById('resultsHint');
const noResultsEl = document.getElementById('noResults');

const DRAG_THRESHOLD = 10;

// ---------- Filter chips ----------
function buildChipRow(container, label, options, activeKey){
  container.innerHTML = '';
  const labelEl = document.createElement('span');
  labelEl.className = 'row-label';
  labelEl.textContent = label;
  container.appendChild(labelEl);

  options.forEach(opt => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (state[activeKey] === opt ? ' active' : '');
    chip.textContent = opt;
    chip.type = 'button';
    chip.addEventListener('click', () => {
      state[activeKey] = opt;
      renderAll();
    });
    container.appendChild(chip);
  });
}

// ---------- Filtering ----------
function matchesFilters(song){
  if (state.genre !== 'All' && song.genre !== state.genre) return false;
  if (state.decade !== 'All' && song.decade !== state.decade) return false;
  if (state.search){
    const q = state.search.toLowerCase();
    const hay = (song.title + ' ' + song.artist).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function activeFilterCount(){
  let n = 0;
  if (state.genre !== 'All') n++;
  if (state.decade !== 'All') n++;
  if (state.search) n++;
  return n;
}

function clearAllFilters(){
  state.search = '';
  state.genre = 'All';
  state.decade = 'All';
  searchInput.value = '';
  renderAll();
}

// ---------- Render ----------
function renderAll(){
  buildChipRow(genreRow, 'Genre', GENRES, 'genre');
  buildChipRow(decadeRow, 'Era', DECADES, 'decade');

  searchWrap.classList.toggle('has-text', !!state.search);

  gridEl.innerHTML = '';
  setGridEl.innerHTML = '';

  const inSet = songs.filter(s => s.inSet);
  const remaining = songs.filter(s => !s.inSet);
  const remainingFiltered = remaining.filter(matchesFilters);

  setGridEl.classList.toggle('empty', inSet.length === 0);
  if (inSet.length === 0){
    const p = document.createElement('p');
    p.className = 'placeholder';
    p.textContent = 'Drag songs up here to build your set';
    setGridEl.appendChild(p);
  } else {
    inSet.forEach(s => setGridEl.appendChild(makeCard(s)));
  }

  if (remainingFiltered.length === 0){
    noResultsEl.style.display = 'block';
  } else {
    noResultsEl.style.display = 'none';
    remainingFiltered.forEach(s => gridEl.appendChild(makeCard(s)));
  }

  setCountEl.textContent = inSet.length ? '(' + inSet.length + ')' : '';
  songCountEl.textContent = songs.length + ' songs \u00B7 tap to view \u00B7 drag to build a set';

  const n = activeFilterCount();
  if (n > 0){
    resultsHint.innerHTML = remainingFiltered.length + ' of ' + remaining.length + ' songs shown'
      + '<span class="clear-filters" id="clearFiltersLink">clear filters</span>';
    document.getElementById('clearFiltersLink').addEventListener('click', clearAllFilters);
  } else {
    resultsHint.textContent = '';
  }
}

function makeCard(song){
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', song.title + ' by ' + song.artist + ', key of ' + song.key);
  card.dataset.id = song.id;
  card.innerHTML = '<span class="key-badge">' + escapeHtml(shortKey(song.key)) + '</span>'
    + '<span class="title">' + escapeHtml(song.title) + '</span>'
    + '<span class="artist">' + escapeHtml(song.artist) + '</span>';

  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openModal(song);
    }
  });

  attachDrag(card, song);
  return card;
}

function shortKey(key){
  // "Bb Major (simplify to G)" -> "G" ; "A Minor" -> "Am" ; "C Major (jazz standard)" -> "C"
  let k = key.split('(')[0].trim();
  const simplifyMatch = key.match(/simplify to ([A-G][b#]?)/i);
  if (simplifyMatch) return simplifyMatch[1];
  k = k.replace(/\s+Major$/i, '').replace(/\s+Minor$/i, 'm');
  return k.trim();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---------- Modal ----------
const modalOverlay = document.getElementById('modalOverlay');
const modalPanel = document.getElementById('modalPanel');
const modalTitle = document.getElementById('modalTitle');
const modalArtist = document.getElementById('modalArtist');
const modalTags = document.getElementById('modalTags');
const modalKey = document.getElementById('modalKey');
const modalForm = document.getElementById('modalForm');
const modalChords = document.getElementById('modalChords');
const modalClose = document.getElementById('modalClose');
const modalTabLink = document.getElementById('modalTabLink');
const modalSetToggle = document.getElementById('modalSetToggle');

let currentModalSong = null;

function openModal(song){
  currentModalSong = song;
  modalTitle.textContent = song.title;
  modalArtist.textContent = song.artist;
  modalKey.textContent = song.key;
  modalTabLink.href = song.url;

  modalTags.innerHTML = '';
  [song.genre, song.decade].forEach(t => {
    const s = document.createElement('span');
    s.textContent = t;
    modalTags.appendChild(s);
  });

  modalForm.innerHTML = '';
  song.form.forEach((step, i) => {
    if (i > 0){
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '\u2192';
      modalForm.appendChild(arrow);
    }
    const chip = document.createElement('span');
    chip.className = 'step';
    chip.textContent = step;
    modalForm.appendChild(chip);
  });

  modalChords.innerHTML = '';
  song.chordSections.forEach(sec => {
    const row = document.createElement('div');
    row.className = 'chord-row';
    row.innerHTML = (sec.section ? '<div class="sec-name">' + escapeHtml(sec.section) + '</div>' : '')
      + '<div class="prog">' + escapeHtml(sec.chords) + '</div>';
    modalChords.appendChild(row);
  });

  updateModalSetToggle();

  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateModalSetToggle(){
  if (!currentModalSong) return;
  modalSetToggle.textContent = currentModalSong.inSet ? '\u2212 Remove from Set' : '+ Add to Set';
}

modalSetToggle.addEventListener('click', () => {
  if (!currentModalSong) return;
  currentModalSong.inSet = !currentModalSong.inSet;
  updateModalSetToggle();
  renderAll();
});

function closeModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
  currentModalSong = null;
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
});

// ---------- Search ----------
searchInput.addEventListener('input', (e) => {
  state.search = e.target.value.trim();
  renderAll();
});
clearSearchBtn.addEventListener('click', () => {
  state.search = '';
  searchInput.value = '';
  searchInput.focus();
  renderAll();
});

// ---------- Drag & drop (click opens modal instead of a URL) ----------
function attachDrag(card, song){
  let startX = 0, startY = 0, moved = false, dragging = false, clone = null;

  card.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    startX = e.clientX;
    startY = e.clientY;
    moved = false;
    dragging = true;
    card.setPointerCapture(e.pointerId);
  });

  card.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!moved && Math.hypot(dx, dy) > DRAG_THRESHOLD){
      moved = true;
      card.classList.add('dragging-source');
      const rect = card.getBoundingClientRect();
      clone = card.cloneNode(true);
      clone.classList.add('drag-clone');
      clone.style.width = rect.width + 'px';
      clone.style.left = rect.left + 'px';
      clone.style.top = rect.top + 'px';
      document.body.appendChild(clone);
    }

    if (moved && clone){
      const rect = clone.getBoundingClientRect();
      clone.style.left = (e.clientX - rect.width / 2) + 'px';
      clone.style.top = (e.clientY - rect.height / 2) + 'px';
      updateDropHighlight(e.clientX, e.clientY);
    }
  });

  card.addEventListener('pointerup', (e) => {
    dragging = false;
    if (moved){
      const target = resolveDropZone(e.clientX, e.clientY);
      if (target === 'set' && !song.inSet){
        song.inSet = true;
        renderAll();
      } else if (target === 'grid' && song.inSet){
        song.inSet = false;
        renderAll();
      }
      if (clone){ clone.remove(); clone = null; }
      card.classList.remove('dragging-source');
      clearDropHighlight();
    } else {
      openModal(song);
    }
    moved = false;
  });

  card.addEventListener('pointercancel', () => {
    dragging = false;
    moved = false;
    if (clone){ clone.remove(); clone = null; }
    card.classList.remove('dragging-source');
    clearDropHighlight();
  });
}

function resolveDropZone(x, y){
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  if (el.closest('#setGrid')) return 'set';
  if (el.closest('#grid')) return 'grid';
  return null;
}

function updateDropHighlight(x, y){
  const zone = resolveDropZone(x, y);
  setGridEl.classList.toggle('drop-active', zone === 'set');
  gridEl.classList.toggle('drop-active', zone === 'grid');
}

function clearDropHighlight(){
  setGridEl.classList.remove('drop-active');
  gridEl.classList.remove('drop-active');
}

renderAll();

</script>
</body>
