<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Setlist</title>
<style>
  :root{
    --bg:#0d0f0d;
    --panel:#171a17;
    --panel-hi:#20241f;
    --line:#2a2f29;
    --text:#f2f1ea;
    --sub:#9aa39a;
    --amber:#e0a640;
    --amber-dim:#7a5c26;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;
  }

  header{
    padding:18px 16px 10px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }

  header h1{
    margin:0;
    font-size:1.15rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--amber);
  }

  header p{
    margin:4px 0 0;
    font-size:.75rem;
    color:var(--sub);
  }

  main{
    padding:12px;
    max-width:1100px;
    margin:0 auto;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }

  @media (orientation:landscape){
    .grid{ grid-template-columns:repeat(4, 1fr); }
  }

  /* fallback for landscape tablets/desktop that don't fire orientation media query */
  @media (min-width:640px) and (min-aspect-ratio:1/1){
    .grid{ grid-template-columns:repeat(4, 1fr); }
  }

  a.card{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:6px;
    min-height:92px;
    padding:12px 8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    text-decoration:none;
    color:var(--text);
    transition:background .12s ease, border-color .12s ease, transform .08s ease;
  }

  a.card:active{
    transform:scale(.97);
    background:var(--panel-hi);
    border-color:var(--amber-dim);
  }

  @media (hover:hover){
    a.card:hover{
      background:var(--panel-hi);
      border-color:var(--amber-dim);
    }
  }

  a.card:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  .title{
    font-size:.95rem;
    font-weight:700;
    line-height:1.2;
  }

  .artist{
    font-size:.72rem;
    font-weight:400;
    color:var(--sub);
    line-height:1.2;
  }

  footer{
    text-align:center;
    padding:20px 12px 30px;
    color:var(--sub);
    font-size:.68rem;
  }
</style>
</head>
<body>

<header>
  <h1>Setlist</h1>
  <p>32 songs &middot; tap for chords</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>Links open Ultimate Guitar</footer>

<script>

    { title: "What I Got", artist: "Sublime", url: "https://tabs.ultimate-guitar.com/tab/sublime/what-i-got-chords-2553" },
    { title: "Wonderwall", artist: "Oasis", url: "https://tabs.ultimate-guitar.com/tab/oasis/wonderwall-chords-6125" },
    { title: "You Can Call Me Al", artist: "Paul Simon", url: "https://tabs.ultimate-guitar.com/tab/paul-simon/you-can-call-me-al-chords-84865" }
  ];

  const grid = document.getElementById('grid');
  songs
    .sort((a, b) => a.title.localeCompare(b.title))
    .forEach(song => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = song.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<span class="title">${song.title}</span><span class="artist">${song.artist}</span>`;
      grid.appendChild(a);
    });
</script>

</body>
</html>
